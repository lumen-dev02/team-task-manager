name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager -d taskmanager_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://taskmanager:ci-test-password@localhost:5432/taskmanager_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - run: go vet ./...
      - run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go build ./cmd/api
      - name: Build container
        run: docker build -t team-task-manager:ci .
